# CivicFlow_Agent CD 워크플로우 (GHCR + Compute Engine 배포)
#
# CI(ci.yml, name: "CI")가 main 브랜치에서 "성공"한 뒤에만 실행됩니다.
# → lint/test가 깨진 코드는 배포되지 않음 (CI를 CD의 전제 조건으로 삼음)
# GitHub Actions에서 api/frontend 두 이미지를 빌드해 GHCR에 Push하고,
# Compute Engine(lumi-agent VM, /home/appuser/civicflow-agent)에서는 Pull만 해서 배포합니다.
# 이 VM엔 다른 프로젝트(lumi-agent)가 이미 호스트 포트 8000을 쓰고 있어서, api는
# 8001로 매핑합니다(docker-compose.prod.yml 참고).
#
# 필요한 GitHub Secrets:
#   - GCE_HOST: Compute Engine 외부 IP (34.47.93.32)
#   - GCE_USERNAME: appuser
#   - GCE_SSH_KEY: CD 전용 SSH 개인키
#   - UPSTAGE_API_KEY / SUPABASE_URL / SUPABASE_KEY / SUPABASE_DATABASE_URL
#   - DATA_GO_KR_API_KEY / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_BASE_URL
#     (아직 등록 안 된 게 있으면 빈 문자열로 채워짐 — /health는 시크릿 없이도 200을 반환하므로
#     배포 자체는 실패하지 않지만, 해당 기능은 값이 채워질 때까지 동작하지 않음)

name: Civic_Flow_CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      rollback:
        description: "이전 버전으로 롤백"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================
  # Job 1: api/frontend 이미지 빌드 & GHCR Push
  # =========================================================
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && !inputs.rollback) }}
    strategy:
      matrix:
        service: [api, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR은 소문자만 허용
      - name: Lowercase repository
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # =========================================================
  # Job 2: Compute Engine 배포 (Pull & Run)
  # =========================================================
  deploy:
    name: Deploy to Compute Engine
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ always() && (needs.build-and-push.result == 'success' || inputs.rollback) }}

    steps:
      - name: Deploy (normal)
        if: ${{ !inputs.rollback }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script: |
            set -e

            echo "배포 시작: ${{ github.sha }}"
            mkdir -p /home/${{ secrets.GCE_USERNAME }}/civicflow-agent
            cd /home/${{ secrets.GCE_USERNAME }}/civicflow-agent

            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
            export API_IMAGE="ghcr.io/${REPO_LOWER}/api:${IMAGE_TAG}"
            export FRONTEND_IMAGE="ghcr.io/${REPO_LOWER}/frontend:${IMAGE_TAG}"

            # docker-compose.prod.yml은 리포에서 매번 최신본을 받아온다 (수동 SSH 없이 갱신)
            curl -sL -o docker-compose.prod.yml "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.prod.yml"

            # .env 재생성 (GitHub Secrets 기준 — 값이 바뀌어도 수동 SSH 없이 항상 최신 유지)
            cat > .env << 'ENV_EOF'
            UPSTAGE_API_KEY=${{ secrets.UPSTAGE_API_KEY }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            SUPABASE_DATABASE_URL=${{ secrets.SUPABASE_DATABASE_URL }}
            DATA_GO_KR_API_KEY=${{ secrets.DATA_GO_KR_API_KEY }}
            LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_BASE_URL=${{ secrets.LANGFUSE_BASE_URL }}
            LANGFUSE_TRACING_ENVIRONMENT=production
            ENV_EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 롤백용으로 현재 배포된 이미지 태그를 보관
            [ -f .current_api_image ] && cp .current_api_image .previous_api_image
            [ -f .current_frontend_image ] && cp .current_frontend_image .previous_frontend_image
            echo "$API_IMAGE" > .current_api_image
            echo "$FRONTEND_IMAGE" > .current_frontend_image

            # 두 이미지를 병렬로 pull. 인자 없는 `wait`는 백그라운드 job이 실패해도 항상 0을
            # 반환해 `set -e`가 못 잡으므로 PID를 각각 잡아서 개별적으로 기다림
            docker pull "$API_IMAGE" & API_PULL_PID=$!
            docker pull "$FRONTEND_IMAGE" & FRONTEND_PULL_PID=$!
            wait "$API_PULL_PID"
            wait "$FRONTEND_PULL_PID"
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # [계획 중, 아직 비활성화] FAQ 원본(data/knowledge_base 등 git에 있는 것)만 배포
            # 때마다 자동 재적재하려면 아래 주석을 해제한다. query_cache/answer_cache는 운영
            # 중 쌓이는 데이터라 여기서 건드리지 않는다 — knowledge_base 계열 컬렉션만 대상.
            # 주의: 지금 backend/app/rag/ingest.py는 "**/*.md"만 찾는데 data/knowledge_base/는
            # 실제로 .json 파일들이라, 그대로 켜면 0건 적재로 끝난다 — 활성화 전에 실제로 쓰는
            # ingest_*.py + merge_chroma_faq.py 계열로 바꾸거나 ingest.py 자체를 고쳐야 한다.
            # docker compose -f docker-compose.prod.yml exec -T api python -m app.rag.ingest

            echo "헬스체크 중..."
            MAX_RETRIES=12
            for i in $(seq 1 $MAX_RETRIES); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "배포 성공 (HTTP $STATUS)"
                docker image prune -af
                exit 0
              fi
              echo "  시도 $i/$MAX_RETRIES (HTTP $STATUS)..."
              if [ "$i" = "$MAX_RETRIES" ]; then
                echo "헬스체크 실패 — 자동 롤백 시도"
                docker compose -f docker-compose.prod.yml logs --tail=100
                if [ -f .previous_api_image ] && [ -f .previous_frontend_image ]; then
                  export API_IMAGE=$(cat .previous_api_image)
                  export FRONTEND_IMAGE=$(cat .previous_frontend_image)
                  docker pull "$API_IMAGE"
                  docker pull "$FRONTEND_IMAGE"
                  docker compose -f docker-compose.prod.yml up -d --force-recreate
                  echo "이전 버전으로 롤백됨"
                fi
                exit 1
              fi
              sleep 5
            done

      - name: Rollback to previous version
        if: ${{ inputs.rollback }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.GCE_USERNAME }}/civicflow-agent

            if [ ! -f .previous_api_image ] || [ ! -f .previous_frontend_image ]; then
              echo "이전 버전 정보가 없습니다"
              exit 1
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export API_IMAGE=$(cat .previous_api_image)
            export FRONTEND_IMAGE=$(cat .previous_frontend_image)
            # 두 이미지를 병렬로 pull. 인자 없는 `wait`는 백그라운드 job이 실패해도 항상 0을
            # 반환해 `set -e`가 못 잡으므로 PID를 각각 잡아서 개별적으로 기다림
            docker pull "$API_IMAGE" & API_PULL_PID=$!
            docker pull "$FRONTEND_IMAGE" & FRONTEND_PULL_PID=$!
            wait "$API_PULL_PID"
            wait "$FRONTEND_PULL_PID"
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            MAX_RETRIES=12
            for i in $(seq 1 $MAX_RETRIES); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "롤백 성공"
                echo "$API_IMAGE" > .current_api_image
                echo "$FRONTEND_IMAGE" > .current_frontend_image
                exit 0
              fi
              sleep 5
            done
            echo "롤백 실패"
            docker compose -f docker-compose.prod.yml logs --tail=50
            exit 1
