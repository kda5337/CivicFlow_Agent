name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: ruff check
        working-directory: backend
        run: python -m ruff check app/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      # non-blocking — 54건 미해결, 대부분 InquiryState(TypedDict) vs dict 불일치 같은
      # LangGraph 특유의 타이핑 마찰. 아직 트리아지 전이라 우선 가시성만 확보한다.
      - name: mypy
        working-directory: backend
        run: mypy app/
        continue-on-error: true

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest
        # 시크릿 없이도 돌아가는 스모크/순수함수 테스트만 있다(backend/tests) — 실제
        # LLM/DB 호출이 필요한 분류 정확도 평가(test/run_classification_eval.py 등)는
        # 비용·속도·비결정성 때문에 CI에 넣지 않고 필요할 때 수동으로 돌린다.
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: eslint
        working-directory: frontend
        run: npm run lint
      - name: build
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (OSS, no license required)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git -v --log-opts="--all" /repo
