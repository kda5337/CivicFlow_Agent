server {
    listen 80;

    # React SPA — 정적 파일 없으면 index.html로 넘겨 클라이언트 라우팅이 처리하게 한다.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # backend/app/api/routers/* 의 실제 prefix들만 api 컨테이너로 프록시.
    location ~ ^/(inquiries|departments|submissions|knowledge-base|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
